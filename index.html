<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr.Muop</title>
<style>
:root{
  --main:#ff2a2a; --main-dark:#c00000; --main-rgb:255,42,42;
  --main-soft:rgba(255,42,42,.15); --main-glow:rgba(255,42,42,.5);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{min-height:100vh;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden;position:relative}
body.bg-image{background-size:cover!important;background-position:center!important;background-repeat:no-repeat!important;background-attachment:fixed!important}
body.bg-image #stars{display:none}
body.bg-color #stars{display:none}
#stars{position:fixed;inset:0;z-index:0;background:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 60% 70%,#fff,transparent),radial-gradient(1px 1px at 50% 50%,#fff,transparent),radial-gradient(1px 1px at 80% 10%,#fff,transparent),radial-gradient(2px 2px at 90% 60%,#fff,transparent),radial-gradient(1px 1px at 33% 80%,#fff,transparent),radial-gradient(1px 1px at 15% 90%,#fff,transparent),radial-gradient(2px 2px at 70% 20%,#fff,transparent),radial-gradient(1px 1px at 45% 15%,#fff,transparent),radial-gradient(1px 1px at 10% 50%,#fff,transparent);background-color:#000;animation:twinkle 4s infinite alternate}
@keyframes twinkle{0%{opacity:.6}100%{opacity:1}}
.card{position:relative;z-index:1;width:100%;max-width:380px;background:rgba(15,15,25,.75);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(20px);border-radius:24px;padding:30px 22px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:fadeUp .6s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.logo-wrap{width:130px;height:130px;margin:0 auto 16px;border-radius:50%;overflow:hidden;cursor:pointer;position:relative;border:3px solid var(--main);box-shadow:0 0 30px var(--main-glow),inset 0 0 20px var(--main-soft);transition:.3s;user-select:none;animation:pulseGlow 3s infinite}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 30px var(--main-glow),inset 0 0 20px var(--main-soft)}50%{box-shadow:0 0 50px var(--main-glow),inset 0 0 30px var(--main-soft)}}
.logo-wrap img{width:100%;height:100%;object-fit:cover}
.logo-wrap .ph{width:100%;height:100%;background:linear-gradient(135deg,#1a0000,#4a0000);display:flex;align-items:center;justify-content:center;font-size:50px;font-weight:900;color:var(--main)}
.logo-wrap:hover{transform:scale(1.05)}
.name{font-size:24px;font-weight:900;background:linear-gradient(135deg,var(--main),var(--main));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;letter-spacing:.5px}
.tagline{font-size:12px;color:var(--main);opacity:.7;margin-bottom:14px;letter-spacing:2px;font-weight:600}
.desc{font-size:13px;color:#a0a0b0;line-height:1.6;margin-bottom:22px;padding:0 6px}
.links{display:flex;flex-direction:column;gap:10px}
.link-btn{display:flex;align-items:center;gap:12px;padding:14px 18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;color:#fff;text-decoration:none;font-size:14px;font-weight:600;transition:.25s;cursor:pointer}
.link-btn:hover{background:var(--main-soft);border-color:var(--main);transform:translateX(4px)}
.link-btn .ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden}
.link-btn .txt{flex:1;text-align:left}
.link-btn .arr{color:#666;font-size:16px}
.ico-facebook{background:linear-gradient(135deg,#1877f2,#0c5dc7)}
.ico-messenger{background:linear-gradient(135deg,#0084ff,#00c6ff)}
.ico-tiktok{background:linear-gradient(135deg,#000,#25f4ee,#fe2c55)}
.ico-zalo{background:linear-gradient(135deg,#0068ff,#0084ff)}
.ico-phone{background:linear-gradient(135deg,#00c853,#00a844)}
.ico-telegram{background:linear-gradient(135deg,#0088cc,#00aaff)}
.ico-discord{background:linear-gradient(135deg,#5865f2,#4752c4)}
.ico-gmail{background:linear-gradient(135deg,#ea4335,#c5221f)}
.ico-youtube{background:linear-gradient(135deg,#ff0000,#cc0000)}
.ico-instagram{background:linear-gradient(135deg,#e1306c,#fd1d1d,#fcb045)}
.ico-twitter{background:linear-gradient(135deg,#1da1f2,#0c85d0)}
.ico-group{background:linear-gradient(135deg,#00c853,#00a844)}
.ico-custom{background:linear-gradient(135deg,var(--main),var(--main-dark))}
.ico-link{background:linear-gradient(135deg,#888,#555)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:999;padding:15px;backdrop-filter:blur(4px)}
.modal-bg.show{display:flex}
.modal{background:#131320;border:1px solid var(--main-soft);border-radius:18px;padding:24px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto;animation:pop .3s}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.modal h2{color:var(--main);font-size:20px;margin-bottom:16px;font-weight:800;text-align:center}
.modal input,.modal textarea,.modal select{width:100%;padding:12px 14px;background:#0a0a14;border:1.5px solid #2a2a3a;border-radius:10px;color:#fff;font-size:14px;margin-bottom:10px;font-family:inherit}
.modal input:focus,.modal textarea:focus,.modal select:focus{outline:none;border-color:var(--main);box-shadow:0 0 0 3px var(--main-soft)}
.modal textarea{min-height:70px;resize:vertical}
.btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--main),var(--main-dark));color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;margin-top:5px;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px var(--main-glow)}
.btn-sec{background:#2a2a3a}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{padding:8px 10px;background:#1a1a2a;color:#fff;border:1px solid #2a2a3a;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600}
.tabs button.active{background:linear-gradient(135deg,var(--main),var(--main-dark));border-color:var(--main)}
.link-row{background:#0a0a14;padding:12px;border-radius:10px;margin-bottom:10px;border-left:3px solid var(--main)}
.link-row h4{font-size:13px;color:var(--main);margin-bottom:5px}
.link-row p{font-size:12px;color:#888;word-break:break-all;margin-bottom:6px}
.link-row button{padding:5px 10px;font-size:11px;border:none;border-radius:6px;cursor:pointer;font-weight:700;color:#fff;margin-right:5px}
.upload-btn{background:#0a0a14;color:#fff;padding:12px;border-radius:10px;text-align:center;cursor:pointer;margin-bottom:12px;font-size:14px;border:2px dashed var(--main);font-weight:600}
.preview{width:100px;height:100px;border-radius:50%;object-fit:cover;margin:0 auto 10px;display:block;border:2px solid var(--main)}
.bg-preview{width:100%;height:150px;border-radius:12px;margin-bottom:10px;background-size:cover;background-position:center;border:2px solid var(--main);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
.notif{position:fixed;top:20px;right:20px;background:linear-gradient(135deg,#00c853,#00a844);color:#fff;padding:12px 18px;border-radius:10px;font-weight:700;font-size:13px;z-index:9999;animation:slideIn .3s;max-width:280px}
.notif.error{background:linear-gradient(135deg,#ef4444,#dc2626)}
@keyframes slideIn{from{transform:translateX(400px)}to{transform:translateX(0)}}
.music-btn{position:fixed;top:20px;left:20px;width:44px;height:44px;border-radius:50%;background:var(--main-soft);border:2px solid var(--main);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;z-index:100;transition:.2s}
.music-btn:hover{transform:scale(1.1)}
.music-btn.playing{animation:spin 3s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.icon-picker{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.icon-picker button{padding:8px;background:#0a0a14;border:1.5px solid #2a2a3a;border-radius:8px;cursor:pointer;font-size:20px}
.icon-picker button:hover,.icon-picker button.selected{border-color:var(--main);background:var(--main-soft)}
.logout-row{display:flex;gap:6px;margin-top:12px}
.logout-row button{flex:1}
.color-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.color-item{aspect-ratio:1/1;border-radius:14px;cursor:pointer;border:3px solid transparent;position:relative;display:flex;align-items:center;justify-content:center;transition:.2s}
.color-item:hover{transform:scale(1.08)}
.color-item.selected{border-color:#fff;box-shadow:0 0 15px rgba(255,255,255,.5)}
.color-item.selected::after{content:'✓';color:#fff;font-size:20px;font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.color-item .lbl{position:absolute;bottom:6px;left:0;right:0;font-size:10px;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.bg-color-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.bg-color-item{aspect-ratio:1/1;border-radius:10px;cursor:pointer;border:3px solid transparent;transition:.2s}
.bg-color-item:hover{transform:scale(1.08)}
.bg-color-item.selected{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.6)}
</style>
</head>
<body>
<div id="stars"></div>
<div class="music-btn" id="musicBtn" onclick="toggleMusic()">🔇</div>

<div class="card">
  <div class="logo-wrap" id="logoWrap" onclick="countLogoClick()">
    <div class="ph" id="logoPh">M</div>
    <img id="logoImg" style="display:none">
  </div>
  <div class="name" id="displayName">Mr.Muop</div>
  <div class="tagline" id="displayTagline">★ HACKER - CRACKER ★</div>
  <div class="desc" id="displayDesc">Chào bạn! Mình là Mr.Muop — chuyên về các dịch vụ công nghệ, script, tool. Liên hệ mình qua các kênh bên dưới nhé!</div>
  <div class="links" id="linkContainer"></div>
</div>

<div class="modal-bg" id="adminLoginModal"><div class="modal">
<h2>🔐 Đăng nhập Admin</h2>
<input id="adminUser" placeholder="Tên đăng nhập">
<input id="adminPass" type="password" placeholder="Mật khẩu">
<button class="btn" onclick="doAdminLogin()">Đăng nhập</button>
<button class="btn btn-sec" onclick="closeModal('adminLoginModal')">Hủy</button>
</div></div>

<div class="modal-bg" id="adminModal"><div class="modal" style="max-width:500px">
<h2>⚙️ Admin Panel</h2>
<div class="tabs">
<button onclick="showTab('info')" id="tabInfo" class="active">📝 TT</button>
<button onclick="showTab('logo')" id="tabLogo">🖼️ Logo</button>
<button onclick="showTab('color')" id="tabColor">🎨 Màu</button>
<button onclick="showTab('background')" id="tabBackground">🌄 Nền</button>
<button onclick="showTab('links')" id="tabLinks">🔗 Link</button>
<button onclick="showTab('music')" id="tabMusic">🎵 Nhạc</button>
</div>
<div id="tabContent"></div>
<div class="logout-row">
<button class="btn btn-danger" onclick="adminLogout()">🚪 Đăng xuất</button>
<button class="btn btn-sec" onclick="closeModal('adminModal')">Đóng</button>
</div>
</div></div>

<div class="modal-bg" id="linkEditModal"><div class="modal">
<h2 id="linkEditTitle">✏️ Sửa link</h2>
<select id="linkType" onchange="onLinkTypeChange()">
<option value="facebook">📘 Facebook</option>
<option value="messenger">💌 Messenger</option>
<option value="tiktok">🎵 TikTok</option>
<option value="zalo">💬 Zalo cá nhân</option>
<option value="zalo-group">👥 Nhóm Zalo</option>
<option value="telegram">✈️ Telegram</option>
<option value="discord">🎮 Discord</option>
<option value="gmail">📧 Gmail</option>
<option value="youtube">▶️ YouTube</option>
<option value="instagram">📷 Instagram</option>
<option value="twitter">🐦 Twitter</option>
<option value="phone">📞 SĐT</option>
<option value="custom">⭐ Tùy chỉnh</option>
<option value="link">🔗 Link khác</option>
</select>
<input id="linkName" placeholder="Tên hiển thị">
<input id="linkUrl" placeholder="Link">
<p style="font-size:13px;color:var(--main);margin:8px 0 6px;font-weight:700">Chọn icon:</p>
<div class="icon-picker" id="iconPicker"></div>
<input id="linkCustomIcon" placeholder="Hoặc nhập emoji tuỳ chỉnh (VD: 🔥)" style="margin-top:6px" oninput="selectCustomIcon(this.value)">
<button class="btn" onclick="saveLink()">💾 Lưu link</button>
<button class="btn btn-sec" onclick="closeModal('linkEditModal')">Hủy</button>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, push, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAOKxix32T2rC9_TrF9mk6socuR0YCcVno",
  authDomain: "mrphuc-51580.firebaseapp.com",
  databaseURL: "https://mrphuc-51580-default-rtdb.firebaseio.com",
  projectId: "mrphuc-51580",
  storageBucket: "mrphuc-51580.firebasestorage.app",
  messagingSenderId: "922607657180",
  appId: "1:922607657180:web:2d1f482bd5aa562214d419"
};
const IMGBB_KEY = "11fa26a3d2a300961577fa631bfc603c";
const ADMIN_USER = "MTP", ADMIN_PASS = "MTP123";
const DB_PATH = "mrmuop_landing", SESSION_KEY = "mrmuop_admin_session";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const THEMES = [
  { id:'red', name:'Đỏ', main:'#ff2a2a', dark:'#c00000', rgb:'255,42,42' },
  { id:'green', name:'Xanh lá', main:'#00c853', dark:'#00a844', rgb:'0,200,83' },
  { id:'blue', name:'Xanh dương', main:'#0084ff', dark:'#0060c0', rgb:'0,132,255' },
  { id:'purple', name:'Tím', main:'#a855f7', dark:'#7c3aed', rgb:'168,85,247' },
  { id:'orange', name:'Cam', main:'#ff6b35', dark:'#d94a1a', rgb:'255,107,53' },
  { id:'pink', name:'Hồng', main:'#ec4899', dark:'#be185d', rgb:'236,72,153' },
  { id:'gold', name:'Vàng', main:'#ffd700', dark:'#d4a900', rgb:'255,215,0' },
  { id:'cyan', name:'Xanh ngọc', main:'#06b6d4', dark:'#0891b2', rgb:'6,182,212' },
];

const BG_COLORS = [
  '#000000','#0a0e17','#131826','#1a0033','#001a33',
  '#1a0000','#0a1a00','#2a1a00','#1a002a','#0f0f0f',
  '#ffffff','#f0f0f0','#e0e8f0','#ffe0e0','#e0ffe0',
];

const ICONS = [
  { e:'📘', c:'facebook' },{ e:'💌', c:'messenger' },{ e:'🎵', c:'tiktok' },
  { e:'💬', c:'zalo' },{ e:'👥', c:'group' },{ e:'✈️', c:'telegram' },
  { e:'🎮', c:'discord' },{ e:'📧', c:'gmail' },{ e:'▶️', c:'youtube' },
  { e:'📷', c:'instagram' },{ e:'🐦', c:'twitter' },{ e:'📞', c:'phone' },
  { e:'⭐', c:'custom' },{ e:'🔗', c:'link' },{ e:'🔥', c:'custom' },
  { e:'💎', c:'custom' },{ e:'🎯', c:'custom' },{ e:'🚀', c:'custom' }
];

const TYPE_ICON = {
  facebook:'📘', messenger:'💌', tiktok:'🎵', zalo:'💬', 'zalo-group':'👥',
  telegram:'✈️', discord:'🎮', gmail:'📧', youtube:'▶️', instagram:'📷',
  twitter:'🐦', phone:'📞', custom:'⭐', link:'🔗'
};

let settings = {
  name:"Mr.Muop", tagline:"★ HACKER - CRACKER ★",
  desc:"Chào bạn! Mình là Mr.Muop — chuyên về các dịch vụ công nghệ, script, tool. Liên hệ mình qua các kênh bên dưới nhé!",
  logo:"", music:"", theme:"red", bgType:"stars", bgValue:"", links:[]
};
let logoClickCount = 0, clickTimer = null, currentTab = 'info';
let editingLinkId = null, selectedIcon = '📘', selectedIconColor = 'facebook';
let musicPlaying = false, isAdminLogged = false;

window.notif = (msg, err=false) => {
  const el = document.createElement('div');
  el.className = 'notif' + (err?' error':'');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2500);
};
window.closeModal = (id) => document.getElementById(id).classList.remove('show');

onValue(ref(db, DB_PATH + '/settings'), (snap) => {
  const d = snap.val();
  if (d) settings = { ...settings, ...d };
  applyTheme(settings.theme || 'red');
  applyBackground();
  render();
});

onValue(ref(db, DB_PATH + '/links'), (snap) => {
  const d = snap.val();
  if (d) {
    settings.links = Object.entries(d).map(([id, l]) => ({ id, ...l })).sort((a,b) => (a.order||0) - (b.order||0));
  } else {
    settings.links = [];
    const defaults = [
      { type:'facebook', name:'Facebook', url:'https://facebook.com', icon:'📘' },
      { type:'tiktok', name:'TikTok', url:'https://tiktok.com', icon:'🎵' },
      { type:'zalo', name:'Zalo', url:'https://zalo.me/0332088542', icon:'💬' },
      { type:'phone', name:'0332 088 542', url:'tel:0332088542', icon:'📞' }
    ];
    defaults.forEach((l, i) => push(ref(db, DB_PATH + '/links'), { ...l, order:i }));
  }
  renderLinks();
  if (currentTab === 'links' && document.getElementById('adminModal').classList.contains('show')) renderTabContent();
});

function applyTheme(themeId){
  const t = THEMES.find(x => x.id === themeId) || THEMES[0];
  const root = document.documentElement;
  root.style.setProperty('--main', t.main);
  root.style.setProperty('--main-dark', t.dark);
  root.style.setProperty('--main-rgb', t.rgb);
  root.style.setProperty('--main-soft', `rgba(${t.rgb},.15)`);
  root.style.setProperty('--main-glow', `rgba(${t.rgb},.5)`);
}

function applyBackground(){
  const body = document.body;
  body.classList.remove('bg-image','bg-color');
  if (settings.bgType === 'image' && settings.bgValue) {
    body.style.background = `url('${settings.bgValue}') center/cover no-repeat fixed`;
    body.classList.add('bg-image');
  } else if (settings.bgType === 'color' && settings.bgValue) {
    body.style.background = settings.bgValue;
    body.classList.add('bg-color');
  } else {
    body.style.background = '#000';
    body.classList.remove('bg-image','bg-color');
  }
}

function render(){
  document.getElementById('displayName').textContent = settings.name || 'Mr.Muop';
  document.getElementById('displayTagline').textContent = settings.tagline || '';
  document.getElementById('displayDesc').textContent = settings.desc || '';
  document.title = settings.name || 'Mr.Muop';
  const li = document.getElementById('logoImg');
  const lp = document.getElementById('logoPh');
  if (settings.logo) { li.src = settings.logo; li.style.display = 'block'; lp.style.display = 'none'; }
  else { li.style.display = 'none'; lp.style.display = 'flex'; lp.textContent = (settings.name || 'M').charAt(0).toUpperCase(); }
}

function renderLinks(){
  const c = document.getElementById('linkContainer');
  if (!c) return;
  c.innerHTML = settings.links.map(l => {
    const ico = l.icon || TYPE_ICON[l.type] || '🔗';
    const cls = l.iconColor ? getIconClass(l.iconColor) : getIconClass(l.type);
    return `<a class="link-btn" href="${l.url}" target="_blank" rel="noopener">
      <div class="ico ${cls}">${ico}</div>
      <div class="txt">${l.name}</div>
      <div class="arr">›</div>
    </a>`;
  }).join('');
}

function getIconClass(type){
  const map = {
    facebook:'ico-facebook', messenger:'ico-messenger', tiktok:'ico-tiktok',
    zalo:'ico-zalo', group:'ico-group', telegram:'ico-telegram',
    discord:'ico-discord', gmail:'ico-gmail', youtube:'ico-youtube',
    instagram:'ico-instagram', twitter:'ico-twitter', phone:'ico-phone',
    custom:'ico-custom', link:'ico-link'
  };
  return map[type] || 'ico-custom';
}

window.countLogoClick = () => {
  logoClickCount++;
  if (clickTimer) clearTimeout(clickTimer);
  clickTimer = setTimeout(() => { logoClickCount = 0; }, 1500);
  if (logoClickCount >= 4) {
    logoClickCount = 0;
    if (isAdminLogged) { window.openAdminPanel(); return; }
    document.getElementById('adminLoginModal').classList.add('show');
    document.getElementById('adminUser').value = '';
    document.getElementById('adminPass').value = '';
  }
};

window.doAdminLogin = () => {
  const u = document.getElementById('adminUser').value.trim();
  const p = document.getElementById('adminPass').value;
  if (u !== ADMIN_USER || p !== ADMIN_PASS) return window.notif('Sai tên hoặc mật khẩu!', true);
  localStorage.setItem(SESSION_KEY, '1');
  isAdminLogged = true;
  closeModal('adminLoginModal');
  window.notif('👑 Chào Admin!');
  setTimeout(() => window.openAdminPanel(), 300);
};

window.adminLogout = () => {
  localStorage.removeItem(SESSION_KEY);
  isAdminLogged = false;
  closeModal('adminModal');
  window.notif('Đã đăng xuất Admin');
};

window.openAdminPanel = () => {
  document.getElementById('adminModal').classList.add('show');
  showTab('info');
};

if (localStorage.getItem(SESSION_KEY) === '1') isAdminLogged = true;

window.showTab = (t) => {
  currentTab = t;
  ['info','logo','color','background','links','music'].forEach(x => {
    const el = document.getElementById('tab' + x.charAt(0).toUpperCase() + x.slice(1));
    if (el) el.classList.toggle('active', x === t);
  });
  renderTabContent();
};

function renderTabContent(){
  const c = document.getElementById('tabContent');
  if (currentTab === 'info') {
    c.innerHTML = `
      <input id="setName" placeholder="Tên hiển thị" value="${settings.name || ''}">
      <input id="setTagline" placeholder="Tagline" value="${settings.tagline || ''}">
      <textarea id="setDesc" placeholder="Mô tả">${settings.desc || ''}</textarea>
      <button class="btn" onclick="saveInfo()">💾 Lưu thông tin</button>`;
  } else if (currentTab === 'logo') {
    c.innerHTML = `
      ${settings.logo ? `<img class="preview" src="${settings.logo}">` : '<p style="text-align:center;color:#888;font-size:13px;margin-bottom:10px">Chưa có logo</p>'}
      <div class="upload-btn" onclick="document.getElementById('logoFile').click()">📷 Chọn ảnh logo</div>
      <input type="file" id="logoFile" accept="image/*" style="display:none" onchange="uploadLogo(this)">
      <p style="text-align:center;color:#888;font-size:12px;margin:8px 0">Hoặc dán link ảnh:</p>
      <input id="logoUrl" placeholder="https://..." value="${settings.logo || ''}">
      <button class="btn" onclick="saveLogoUrl()">💾 Lưu link ảnh</button>
      ${settings.logo ? `<button class="btn btn-danger" onclick="removeLogo()" style="margin-top:8px">🗑 Xóa logo</button>` : ''}`;
  } else if (currentTab === 'color') {
    const cur = settings.theme || 'red';
    c.innerHTML = `
      <p style="font-size:13px;color:#aaa;margin-bottom:12px;text-align:center">Chọn màu chủ đạo</p>
      <div class="color-grid">
        ${THEMES.map(t => `
          <div class="color-item ${cur===t.id?'selected':''}" 
               style="background:linear-gradient(135deg,${t.main},${t.dark})"
               onclick="pickTheme('${t.id}')">
            <div class="lbl">${t.name}</div>
          </div>`).join('')}
      </div>
      <p style="font-size:12px;color:#666;text-align:center">Màu áp dụng cho logo, nút, tiêu đề...</p>`;
  } else if (currentTab === 'background') {
    const type = settings.bgType || 'stars';
    c.innerHTML = `
      <p style="font-size:13px;color:#aaa;margin-bottom:12px;text-align:center">Chọn nền cho web</p>
      
      <div class="tabs" style="margin-bottom:12px">
        <button onclick="setBgType('stars')" class="${type==='stars'?'active':''}" style="flex:1">✨ Sao</button>
        <button onclick="setBgType('color')" class="${type==='color'?'active':''}" style="flex:1">🎨 Màu</button>
        <button onclick="setBgType('image')" class="${type==='image'?'active':''}" style="flex:1">🖼️ Ảnh</button>
      </div>

      ${type === 'color' ? `
        <p style="font-size:12px;color:#888;margin-bottom:8px">Chọn màu nền:</p>
        <div class="bg-color-grid">
          ${BG_COLORS.map(col => `
            <div class="bg-color-item ${settings.bgValue===col?'selected':''}" 
                 style="background:${col};border:2px solid #2a2a3a"
                 onclick="setBgColor('${col}')"></div>`).join('')}
        </div>
        <p style="font-size:12px;color:#888;margin:8px 0">Hoặc nhập mã màu:</p>
        <input id="bgCustomColor" type="color" value="${settings.bgValue || '#000000'}" onchange="setBgColor(this.value)" style="height:50px;width:100%;border-radius:10px;cursor:pointer;padding:4px;background:#0a0a14;border:1.5px solid #2a2a3a">
      ` : ''}

      ${type === 'image' ? `
        <div class="bg-preview" id="bgPreview" style="${settings.bgValue?`background-image:url('${settings.bgValue}')`:''}">
          ${!settings.bgValue ? 'Chưa có ảnh nền' : ''}
        </div>
        <div class="upload-btn" onclick="document.getElementById('bgFile').click()">📷 Chọn ảnh nền từ máy</div>
        <input type="file" id="bgFile" accept="image/*" style="display:none" onchange="uploadBg(this)">
        <p style="text-align:center;color:#888;font-size:12px;margin:8px 0">Hoặc dán link ảnh nền:</p>
        <input id="bgUrl" placeholder="https://..." value="${settings.bgValue || ''}">
        <button class="btn" onclick="saveBgUrl()">💾 Lưu link ảnh</button>
      ` : ''}

      <button class="btn btn-danger" onclick="resetBg()" style="margin-top:12px">🔄 Reset về mặc định (sao)</button>
      <p style="font-size:11px;color:#666;margin-top:10px;text-align:center">💡 Ảnh nền sẽ phủ toàn màn hình, card vẫn nổi lên trên</p>`;
  } else if (currentTab === 'links') {
    c.innerHTML = `
      <button class="btn" onclick="openLinkEdit(null)" style="margin-bottom:14px">➕ Thêm link mới</button>
      ${settings.links.length === 0 ? '<p style="text-align:center;color:#888;font-size:13px">Chưa có link</p>' : ''}
      ${settings.links.map(l => `
        <div class="link-row">
          <h4>${l.icon || '🔗'} ${l.name}</h4>
          <p>${l.url}</p>
          <button style="background:#2a2a3a" onclick="openLinkEdit('${l.id}')">✏️ Sửa</button>
          <button style="background:#ef4444" onclick="deleteLink('${l.id}')">🗑 Xóa</button>
        </div>`).join('')}`;
  } else if (currentTab === 'music') {
    c.innerHTML = `
      <p style="font-size:13px;color:#aaa;margin-bottom:12px;text-align:center">Dán link nhạc mp3</p>
      <input id="musicUrl" placeholder="https://... .mp3" value="${settings.music || ''}">
      <button class="btn" onclick="saveMusic()">💾 Lưu nhạc</button>
      ${settings.music ? `<button class="btn btn-danger" onclick="removeMusic()" style="margin-top:8px">🗑 Xóa nhạc</button>` : ''}`;
  }
}

window.setBgType = async (type) => {
  settings.bgType = type;
  if (type === 'stars') settings.bgValue = '';
  await update(ref(db, DB_PATH + '/settings'), { bgType: type, bgValue: settings.bgValue });
  applyBackground();
  renderTabContent();
  window.notif('Đã đổi kiểu nền!');
};

window.setBgColor = async (col) => {
  settings.bgType = 'color';
  settings.bgValue = col;
  await update(ref(db, DB_PATH + '/settings'), { bgType: 'color', bgValue: col });
  applyBackground();
  renderTabContent();
  window.notif('🎨 Đã đổi màu nền!');
};

window.saveBgUrl = async () => {
  const url = document.getElementById('bgUrl').value.trim();
  if (!url) return window.notif('Nhập link ảnh', true);
  settings.bgType = 'image';
  settings.bgValue = url;
  await update(ref(db, DB_PATH + '/settings'), { bgType: 'image', bgValue: url });
  applyBackground();
  renderTabContent();
  window.notif('✅ Đã lưu ảnh nền!');
};

window.uploadBg = async (inp) => {
  const f = inp.files[0]; if (!f) return;
  window.notif('⏳ Đang tải ảnh...');
  try {
    const url = await uploadToImgBB(f);
    settings.bgType = 'image';
    settings.bgValue = url;
    await update(ref(db, DB_PATH + '/settings'), { bgType: 'image', bgValue: url });
    applyBackground();
    renderTabContent();
    window.notif('✅ Đã up ảnh nền!');
  } catch(e) { window.notif('Lỗi: ' + e.message, true); }
};

window.resetBg = async () => {
  if (!confirm('Reset nền về mặc định (sao)')) return;
  settings.bgType = 'stars';
  settings.bgValue = '';
  await update(ref(db, DB_PATH + '/settings'), { bgType: 'stars', bgValue: '' });
  applyBackground();
  renderTabContent();
  window.notif('Đã reset nền');
};

window.pickTheme = async (themeId) => {
  settings.theme = themeId;
  applyTheme(themeId);
  await update(ref(db, DB_PATH + '/settings'), { theme: themeId });
  window.notif('🎨 Đã đổi màu!');
  renderTabContent();
};

window.saveInfo = async () => {
  const name = document.getElementById('setName').value.trim();
  const tagline = document.getElementById('setTagline').value.trim();
  const desc = document.getElementById('setDesc').value.trim();
  if (!name) return window.notif('Nhập tên', true);
  await update(ref(db, DB_PATH + '/settings'), { name, tagline, desc });
  settings.name = name; settings.tagline = tagline; settings.desc = desc;
  window.notif('Đã lưu!');
  render();
};

async function uploadToImgBB(file){
  const fd = new FormData();
  fd.append('image', file);
  const r = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method:'POST', body:fd });
  const d = await r.json();
  if (d.success) return d.data.url;
  throw new Error('Lỗi upload');
}

window.uploadLogo = async (inp) => {
  const f = inp.files[0]; if (!f) return;
  window.notif('⏳ Đang tải...');
  try {
    const url = await uploadToImgBB(f);
    await update(ref(db, DB_PATH + '/settings'), { logo: url });
    settings.logo = url; render(); renderTabContent();
    window.notif('✅ Đã đổi logo!');
  } catch(e) { window.notif('Lỗi: ' + e.message, true); }
};

window.saveLogoUrl = async () => {
  const url = document.getElementById('logoUrl').value.trim();
  await update(ref(db, DB_PATH + '/settings'), { logo: url });
  settings.logo = url; render(); renderTabContent();
  window.notif('Đã lưu!');
};

window.removeLogo = async () => {
  if (!confirm('Xóa logo?')) return;
  await update(ref(db, DB_PATH + '/settings'), { logo: '' });
  settings.logo = ''; render(); renderTabContent();
  window.notif('Đã xóa');
};

window.onLinkTypeChange = () => {
  const t = document.getElementById('linkType').value;
  selectedIcon = TYPE_ICON[t] || '🔗';
  selectedIconColor = t === 'zalo-group' ? 'group' : t;
  renderIconPicker();
};

function renderIconPicker(){
  const c = document.getElementById('iconPicker');
  if (!c) return;
  c.innerHTML = ICONS.map(i => `
    <button onclick="pickIcon('${i.e}','${i.c}')" class="${selectedIcon===i.e?'selected':''}">${i.e}</button>
  `).join('');
}

window.pickIcon = (emoji, color) => {
  selectedIcon = emoji; selectedIconColor = color;
  document.getElementById('linkCustomIcon').value = '';
  renderIconPicker();
};

window.selectCustomIcon = (val) => {
  if (val.trim()) { selectedIcon = val.trim(); selectedIconColor = 'custom'; renderIconPicker(); }
};

window.openLinkEdit = (id) => {
  editingLinkId = id;
  if (id) {
    const l = settings.links.find(x => x.id === id);
    document.getElementById('linkEditTitle').textContent = '✏️ Sửa link';
    document.getElementById('linkType').value = l.type || 'link';
    document.getElementById('linkName').value = l.name || '';
    document.getElementById('linkUrl').value = l.url || '';
    selectedIcon = l.icon || '🔗';
    selectedIconColor = l.iconColor || l.type;
    document.getElementById('linkCustomIcon').value = '';
  } else {
    document.getElementById('linkEditTitle').textContent = '➕ Thêm link';
    document.getElementById('linkType').value = 'facebook';
    document.getElementById('linkName').value = '';
    document.getElementById('linkUrl').value = '';
    selectedIcon = '📘'; selectedIconColor = 'facebook';
    document.getElementById('linkCustomIcon').value = '';
  }
  renderIconPicker();
  document.getElementById('linkEditModal').classList.add('show');
};

window.saveLink = async () => {
  const type = document.getElementById('linkType').value;
  const name = document.getElementById('linkName').value.trim();
  const url = document.getElementById('linkUrl').value.trim();
  if (!name || !url) return window.notif('Nhập đủ tên và link', true);
  const icon = selectedIcon || TYPE_ICON[type] || '🔗';
  const iconColor = selectedIconColor || type;
  if (editingLinkId) {
    await update(ref(db, DB_PATH + '/links/' + editingLinkId), { type, name, url, icon, iconColor });
    window.notif('✅ Đã sửa!');
  } else {
    await push(ref(db, DB_PATH + '/links'), { type, name, url, icon, iconColor, order: Date.now() });
    window.notif('✅ Đã thêm!');
  }
  closeModal('linkEditModal');
  setTimeout(() => renderTabContent(), 400);
};

window.deleteLink = async (id) => {
  if (!confirm('Xóa link này?')) return;
  await remove(ref(db, DB_PATH + '/links/' + id));
  window.notif('Đã xóa');
  setTimeout(() => renderTabContent(), 400);
};

window.saveMusic = async () => {
  const url = document.getElementById('musicUrl').value.trim();
  await update(ref(db, DB_PATH + '/settings'), { music: url });
  settings.music = url;
  window.notif('Đã lưu nhạc!');
  renderTabContent();
};

window.removeMusic = async () => {
  if (!confirm('Xóa nhạc?')) return;
  await update(ref(db, DB_PATH + '/settings'), { music: '' });
  settings.music = '';
  window.notif('Đã xóa');
  renderTabContent();
};

const audio = new Audio();
audio.loop = true;

window.toggleMusic = () => {
  const btn = document.getElementById('musicBtn');
  if (!settings.music) return window.notif('Chưa có nhạc!', true);
  if (musicPlaying) {
    audio.pause(); musicPlaying = false;
    btn.textContent = '🔇'; btn.classList.remove('playing');
  } else {
    audio.src = settings.music;
    audio.play().then(() => {
      musicPlaying = true;
      btn.textContent = '🔊'; btn.classList.add('playing');
    }).catch(e => window.notif('Lỗi nhạc: ' + e.message, true));
  }
};

render();
renderIconPicker();
</script>
</body>
</html>
